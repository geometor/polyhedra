<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="dodecahedron_solidum">
  <style>
    .euclid-graphic {
      background-color: transparent;
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #2b2116;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #d4af37;
      fill-opacity: 0.45;
      stroke: #f59e0b;
      stroke-width: 1.8;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #e8dec8;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #e8dec8;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
