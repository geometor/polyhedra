<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" class="euclid-graphic" data-graphic-id="tetrahedron_net">
  <style>
    .euclid-graphic {
      background-color: transparent;
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .net-face {
      fill: #fdfbf7;
      stroke: none;
    }
    .net-hinge {
      stroke: #d97706;
      stroke-width: 1.5;
      stroke-dasharray: 5 3.5;
      stroke-linecap: round;
      fill: none;
    }
    .net-cut {
      stroke: #1e293b;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      .net-face { fill: #1c2128; }
      .net-cut { stroke: #e2d5b8; }
      .net-hinge { stroke: #fbbf24; }
      .geom-label { fill: #f1f5f9; }
    }
    html[data-theme="dark"] .net-face { fill: #1c2128; }
    html[data-theme="dark"] .net-cut { stroke: #e2d5b8; }
    html[data-theme="dark"] .net-hinge { stroke: #fbbf24; }
    html[data-theme="dark"] .geom-label { fill: #f1f5f9; }
  </style>
  <defs />
  <g id="net-faces">
    <polygon points="167.85,210.00 352.15,210.00 260.00,50.40" class="net-face" data-face-idx="0" />
    <polygon points="167.85,210.00 260.00,369.60 352.15,210.00" class="net-face" data-face-idx="1" />
    <polygon points="352.15,210.00 444.29,50.40 260.00,50.40" class="net-face" data-face-idx="3" />
    <polygon points="167.85,210.00 260.00,50.40 75.71,50.40" class="net-face" data-face-idx="2" />
  </g>
  <g id="net-hinges">
    <line x1="167.85" y1="210.00" x2="352.15" y2="210.00" class="net-hinge" />
    <line x1="352.15" y1="210.00" x2="260.00" y2="50.40" class="net-hinge" />
    <line x1="260.00" y1="50.40" x2="167.85" y2="210.00" class="net-hinge" />
  </g>
  <g id="net-cuts">
    <line x1="167.85" y1="210.00" x2="260.00" y2="369.60" class="net-cut" />
    <line x1="260.00" y1="369.60" x2="352.15" y2="210.00" class="net-cut" />
    <line x1="352.15" y1="210.00" x2="444.29" y2="50.40" class="net-cut" />
    <line x1="444.29" y1="50.40" x2="260.00" y2="50.40" class="net-cut" />
    <line x1="260.00" y1="50.40" x2="75.71" y2="50.40" class="net-cut" />
    <line x1="75.71" y1="50.40" x2="167.85" y2="210.00" class="net-cut" />
  </g>
  <g id="net-labels">
    <text x="260.00" y="156.80" text-anchor="middle" dominant-baseline="central" class="geom-label">F1</text>
    <text x="260.00" y="263.20" text-anchor="middle" dominant-baseline="central" class="geom-label">F2</text>
    <text x="352.15" y="103.60" text-anchor="middle" dominant-baseline="central" class="geom-label">F4</text>
    <text x="167.85" y="103.60" text-anchor="middle" dominant-baseline="central" class="geom-label">F3</text>
  </g>
</svg>