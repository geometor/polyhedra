    <polygon points="390.24,166.31 296.52,397.99 457.60,372.72" fill="#548eaa" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="pyramid" data-face-idx="0" />
