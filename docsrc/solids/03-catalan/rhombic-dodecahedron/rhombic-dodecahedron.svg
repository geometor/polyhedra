<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="rhombic-dodecahedron">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #1e3a8a;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #f59e0b;
      fill-opacity: 0.30;
      stroke: #b45309;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #93c5fd;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #93c5fd;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
