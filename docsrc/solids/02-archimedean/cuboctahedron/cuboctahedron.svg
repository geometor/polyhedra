    <line x1="339.77" y1="61.21" x2="229.12" y2="167.03" class="poly-hidden" />
    <line x1="457.60" y1="213.59" x2="339.77" y2="61.21" class="poly-hidden" />
    <line x1="187.56" y1="418.79" x2="159.30" y2="323.32" class="poly-hidden" />
    <line x1="333.45" y1="305.36" x2="159.30" y2="323.32" class="poly-hidden" />
    <line x1="391.30" y1="393.76" x2="333.45" y2="305.36" class="poly-hidden" />
  </g>
  <g id="faces">
