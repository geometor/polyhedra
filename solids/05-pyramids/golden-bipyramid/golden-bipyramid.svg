<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="golden-bipyramid">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #1e3a8a;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #f59e0b;
      fill-opacity: 0.30;
      stroke: #b45309;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #93c5fd;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #93c5fd;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
  <defs />
  <g id="hidden-edges">
    <line x1="457.60" y1="234.58" x2="229.12" y2="188.02" class="poly-hidden" />
    <line x1="229.12" y1="188.02" x2="267.93" y2="70.44" class="poly-hidden" />
    <line x1="229.12" y1="188.02" x2="62.40" y2="268.76" class="poly-hidden" />
    <line x1="229.12" y1="188.02" x2="267.93" y2="409.56" class="poly-hidden" />
  </g>
  <g id="faces">
    <polygon points="457.60,234.58 323.05,340.43 267.93,409.56" fill="#548eaa" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="pyramid" data-face-idx="4" />
    <polygon points="323.05,340.43 62.40,268.76 267.93,409.56" fill="#548eaa" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="pyramid" data-face-idx="7" />
    <polygon points="323.05,340.43 457.60,234.58 267.93,70.44" fill="#548eaa" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="pyramid" data-face-idx="0" />
    <polygon points="62.40,268.76 323.05,340.43 267.93,70.44" fill="#548eaa" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="pyramid" data-face-idx="3" />
  </g>
</svg>