<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="hexahedron_solidum">
  <style>
    .euclid-graphic {
      background-color: transparent;
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #2b2116;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #d4af37;
      fill-opacity: 0.45;
      stroke: #f59e0b;
      stroke-width: 1.8;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #e8dec8;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #e8dec8;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
  <defs />
  <g id="hidden-edges">
    <line x1="229.98" y1="57.60" x2="232.52" y2="265.16" class="poly-hidden" />
    <line x1="232.52" y1="265.16" x2="95.28" y2="351.46" class="poly-hidden" />
    <line x1="426.61" y1="315.80" x2="232.52" y2="265.16" class="poly-hidden" />
  </g>
  <g id="faces">
    <polygon points="440.07,89.65 229.98,57.60 79.93,112.51 314.89,158.75" fill="#b8b3a9" stroke="#2b2116" stroke-width="1.4" class="poly-stroke" data-face-role="base" data-face-idx="4" />
    <polygon points="440.07,89.65 314.89,158.75 310.39,422.40 426.61,315.80" fill="#a5a097" stroke="#2b2116" stroke-width="1.4" class="poly-stroke" data-face-role="base" data-face-idx="0" />
    <polygon points="314.89,158.75 79.93,112.51 95.28,351.46 310.39,422.40" fill="#a5a097" stroke="#2b2116" stroke-width="1.4" class="poly-stroke" data-face-role="base" data-face-idx="3" />
  </g>
</svg>