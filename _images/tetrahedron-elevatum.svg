<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="tetrahedron-elevatum">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #1e3a8a;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #f59e0b;
      fill-opacity: 0.30;
      stroke: #b45309;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #93c5fd;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #93c5fd;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
  <defs />
  <g id="hidden-edges">
    <line x1="296.52" y1="397.99" x2="240.56" y2="293.64" class="poly-hidden" />
    <line x1="240.56" y1="293.64" x2="457.60" y2="372.72" class="poly-hidden" />
    <line x1="390.24" y1="166.31" x2="240.56" y2="293.64" class="poly-hidden" />
    <line x1="240.56" y1="293.64" x2="223.07" y2="64.74" class="poly-hidden" />
    <line x1="240.56" y1="293.64" x2="137.08" y2="184.77" class="poly-hidden" />
    <line x1="240.56" y1="293.64" x2="62.40" y2="415.26" class="poly-hidden" />
  </g>
  <g id="faces">
