    <line x1="288.42" y1="221.16" x2="152.67" y2="232.67" class="poly-hidden" />
    <line x1="152.67" y1="232.67" x2="79.87" y2="164.25" class="poly-hidden" />
    <line x1="381.05" y1="143.41" x2="335.50" y2="57.60" class="poly-hidden" />
    <line x1="236.68" y1="345.78" x2="152.67" y2="232.67" class="poly-hidden" />
  </g>
