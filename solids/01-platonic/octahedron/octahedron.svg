<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" class="euclid-graphic" data-graphic-id="octahedron">
  <style>
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
    }
    .poly-stroke {
      stroke: #1e3a8a;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .poly-hidden {
      stroke: #94a3b8;
      stroke-dasharray: 3 3;
      stroke-width: 1.0;
      opacity: 0.5;
      fill: none;
    }
    .poly-gold {
      fill: #f59e0b;
      fill-opacity: 0.30;
      stroke: #b45309;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .poly-stroke {
        stroke: #93c5fd;
      }
      .poly-hidden {
        stroke: #64748b;
        opacity: 0.6;
      }
    }
    html[data-theme="dark"] .poly-stroke {
      stroke: #93c5fd;
    }
    html[data-theme="dark"] .poly-hidden {
      stroke: #64748b;
      opacity: 0.6;
    }
  </style>
  <defs />
  <g id="hidden-edges">
    <line x1="427.46" y1="296.04" x2="334.26" y2="199.13" class="poly-hidden" />
    <line x1="334.26" y1="199.13" x2="244.18" y2="57.60" class="poly-hidden" />
    <line x1="334.26" y1="199.13" x2="244.18" y2="422.40" class="poly-hidden" />
    <line x1="92.54" y1="217.64" x2="334.26" y2="199.13" class="poly-hidden" />
    <line x1="92.54" y1="217.64" x2="244.18" y2="422.40" class="poly-hidden" />
  </g>
  <g id="faces">
    <polygon points="92.54,217.64 121.99,326.39 244.18,57.60" fill="#739bc7" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="base" data-face-idx="5" />
    <polygon points="427.46,296.04 121.99,326.39 244.18,422.40" fill="#6385ab" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="base" data-face-idx="2" />
    <polygon points="427.46,296.04 244.18,57.60 121.99,326.39" fill="#6385ab" fill-opacity="0.88" stroke="#1e3a8a" stroke-width="1.3" class="poly-stroke" data-face-role="base" data-face-idx="1" />
  </g>
</svg>